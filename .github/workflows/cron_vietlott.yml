name: 20h00 - Report Vietlott Smart Tickets

on:
  schedule:
    # 13:00 UTC = 20:00 giờ Việt Nam
    - cron: '0 13 * * *'
  workflow_dispatch:

jobs:
  report-vietlott:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Fetch Latest Data
        run: |
          python scripts/fetch_data.py

      - name: Send Vietlott Report to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python scripts/send_vietlott.py

      - name: Commit and Push Updated Data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff-index --quiet HEAD || git commit -m "bot: Cập nhật dữ liệu Vietlott [skip ci]"
          git push
