name: 18h30 - Report XSMB XSMT XSMN

on:
  schedule:
    # 11:30 UTC = 18:30 giờ Việt Nam
    - cron: '30 11 * * *'
  workflow_dispatch:

jobs:
  report-3mien:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Fetch Latest Data
        run: |
          python scripts/fetch_data.py

      - name: Send 3-Mien Report to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python scripts/send_3mien.py

      - name: Commit and Push Updated Data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff-index --quiet HEAD || git commit -m "bot: Cập nhật dữ liệu Xổ số 3 Miền [skip ci]"
          git push
