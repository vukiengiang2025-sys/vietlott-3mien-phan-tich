name: Auto Update Vietlott Data

on:
  schedule:
    # Chạy tự động lúc 12:00 UTC (19:00 giờ Việt Nam - sau giờ mở thưởng Vietlott)
    - cron: '0 12 * * *'
  workflow_dispatch: # Cho phép bấm nút chạy thủ công trên giao diện GitHub

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Update & Clean Script
        run: |
          python update_and_clean.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add *.txt *.jsonl
          git diff-index --quiet HEAD || git commit -m "bot: Tự động cập nhật dữ liệu Vietlott mới nhất [skip ci]"
          git push
