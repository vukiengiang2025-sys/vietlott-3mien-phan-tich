name: Auto Update Vietlott Data

on:
  schedule:
    # Chạy tự động lúc 12:00 UTC (19:00 giờ Việt Nam)
    - cron: '0 14 * * *'
  workflow_dispatch:

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      # Cập nhật v4 -> v5
      - name: Checkout Repository
        uses: actions/checkout@v5

      # Cập nhật v5 -> v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Update & Clean Script
        run: |
          python update_and_clean.py

      - name: Send Smart Tickets to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python send_telegram.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add *.txt *.jsonl
          git diff-index --quiet HEAD || git commit -m "bot: Tự động cập nhật dữ liệu Vietlott mới nhất [skip ci]"
          git push
